# Deploys the API to AWS.
# - Every push to main deploys to staging.
# - Every version tag (v1.0.0, v1.2.3, ...) deploys to production.
# - It can also be run by hand from the Actions tab.
# Setup steps are in docs/deploy-setup.md. Until they are done, this workflow skips itself.
name: Deploy

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Where to deploy
        type: choice
        options: [staging, production]

permissions:
  id-token: write # lets GitHub prove to AWS who it is, so no AWS keys are stored here
  contents: read

jobs:
  deploy:
    if: vars.AWS_DEPLOY_ROLE_ARN != ''
    runs-on: ubuntu-latest
    environment: ${{ inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          STAGE: test
      # sam build bundles the code with esbuild and looks for it on the PATH;
      # esbuild is already installed as a dev dependency by npm ci.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      # If AWS refuses the login, show what GitHub told AWS about this run
      # (the claims the role's trust policy checks). The token itself is not printed.
      - name: Show the GitHub identity AWS saw
        if: failure()
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" |
            python3 -c "import sys, json, base64
          part = json.load(sys.stdin)['value'].split('.')[1]
          claims = json.loads(base64.urlsafe_b64decode(part + '=' * (-len(part) % 4)))
          print(json.dumps({k: claims.get(k) for k in ['sub', 'aud', 'iss', 'repository', 'environment', 'ref']}, indent=2))"
      - uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - run: sam build
      - name: sam deploy
        run: >
          sam deploy
          --config-env "$STAGE"
          --no-confirm-changeset
          --no-fail-on-empty-changeset
          --parameter-overrides
          Stage="$STAGE"
          JwtSecret="$JWT_SECRET"
          GoogleClientId="$GOOGLE_CLIENT_ID"
          AllowedOrigins="$ALLOWED_ORIGINS"
        env:
          STAGE: ${{ inputs.stage || (startsWith(github.ref, 'refs/tags/') && 'production' || 'staging') }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          ALLOWED_ORIGINS: ${{ vars.ALLOWED_ORIGINS }}
